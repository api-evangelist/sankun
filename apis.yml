aid: sankun
name: Sankun
description: Sankun (산군) is a South Korean construction-industry big data platform based in Seoul
  that aggregates and sells access to eight integrated construction databases covering roughly 280,000
  construction companies, some 820,000 project sites, government e-procurement bids, contract awards,
  professional reputation reviews, and construction news. Alongside its web application and a construction
  sales CRM (Sankun Sales), the company markets a Sankun API (data.sankun.com) for programmatic access
  to its construction data, though public developer documentation is gated behind sales and login. Sankun
  is a portfolio company of 500 Global.
